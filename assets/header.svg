<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0f1f"/>
      <stop offset="0.65" stop-color="#2a1745"/>
      <stop offset="1" stop-color="#5b1f4a"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff4d4d"/>
      <stop offset="1" stop-color="#b3121b"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff6c2" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#fff6c2" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffcf5c"/>
      <stop offset="1" stop-color="#ff5e7e"/>
    </radialGradient>
    <clipPath id="frame"><rect width="900" height="260" rx="16"/></clipPath>
    <g id="skyline">
      <rect x="0" y="120" width="40" height="70" fill="#1a1530"/>
      <rect x="45" y="95" width="30" height="95" fill="#211a3d"/>
      <rect x="80" y="130" width="55" height="60" fill="#1a1530"/>
      <rect x="140" y="80" width="28" height="110" fill="#241c44"/>
      <rect x="172" y="110" width="45" height="80" fill="#1a1530"/>
      <rect x="222" y="140" width="35" height="50" fill="#211a3d"/>
      <rect x="262" y="100" width="40" height="90" fill="#1a1530"/>
      <rect x="306" y="125" width="50" height="65" fill="#241c44"/>
      <rect x="360" y="90" width="26" height="100" fill="#1a1530"/>
      <rect x="390" y="135" width="60" height="55" fill="#211a3d"/>
      <g fill="#ffd36b" opacity="0.7">
        <rect x="52" y="105" width="4" height="4"/><rect x="62" y="120" width="4" height="4"/>
        <rect x="148" y="95" width="4" height="4"/><rect x="156" y="125" width="4" height="4"/>
        <rect x="270" y="112" width="4" height="4"/><rect x="285" y="140" width="4" height="4"/>
        <rect x="366" y="104" width="4" height="4"/><rect x="372" y="150" width="4" height="4"/>
        <rect x="185" y="125" width="4" height="4"/><rect x="320" y="140" width="4" height="4"/>
      </g>
    </g>
    <g id="lamp">
      <rect x="0" y="150" width="3" height="45" fill="#3a3358"/>
      <rect x="0" y="150" width="14" height="3" fill="#3a3358"/>
      <circle cx="14" cy="155" r="4" fill="#ffe08a"/>
      <circle cx="14" cy="155" r="12" fill="#ffe08a" opacity="0.15"/>
    </g>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="900" height="260" fill="url(#sky)"/>

    <!-- stars twinkle -->
    <g fill="#fff">
      <circle cx="80" cy="30" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="230" cy="55" r="1"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="410" cy="22" r="1.4"><animate attributeName="opacity" values="1;0.3;1" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="560" cy="45" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.3s" repeatCount="indefinite"/></circle>
      <circle cx="720" cy="28" r="1.2"><animate attributeName="opacity" values="1;0.4;1" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="850" cy="60" r="1"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.6s" repeatCount="indefinite"/></circle>
    </g>

    <!-- retro sun -->
    <circle cx="780" cy="118" r="52" fill="url(#sun)" opacity="0.95"/>
    <g fill="#2a1745">
      <rect x="720" y="118" width="120" height="3"/>
      <rect x="720" y="130" width="120" height="5"/>
      <rect x="720" y="144" width="120" height="7"/>
    </g>

    <!-- skyline parallax (slow) -->
    <g>
      <use href="#skyline" x="0"/><use href="#skyline" x="450"/><use href="#skyline" x="900"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-450 0" dur="12s" repeatCount="indefinite"/>
    </g>

    <!-- road -->
    <rect x="0" y="190" width="900" height="70" fill="#14121f"/>
    <rect x="0" y="190" width="900" height="3" fill="#ff5e7e" opacity="0.8"/>

    <!-- street lamps (faster) -->
    <g>
      <use href="#lamp" x="40"/><use href="#lamp" x="340"/><use href="#lamp" x="640"/><use href="#lamp" x="940"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-300 0" dur="2.4s" repeatCount="indefinite"/>
    </g>

    <!-- lane dashes (fastest) -->
    <line x1="0" y1="232" x2="960" y2="232" stroke="#ffd36b" stroke-width="4" stroke-dasharray="30 30">
      <animate attributeName="stroke-dashoffset" from="0" to="60" dur="0.35s" repeatCount="indefinite"/>
    </line>

    <!-- speed lines -->
    <g stroke="#ffffff" stroke-linecap="round" opacity="0.5">
      <line x1="900" y1="205" x2="960" y2="205" stroke-width="2">
        <animate attributeName="x1" values="900;-80" dur="0.9s" repeatCount="indefinite"/>
        <animate attributeName="x2" values="960;-20" dur="0.9s" repeatCount="indefinite"/>
      </line>
      <line x1="900" y1="250" x2="980" y2="250" stroke-width="2">
        <animate attributeName="x1" values="900;-100" dur="0.7s" begin="0.3s" repeatCount="indefinite"/>
        <animate attributeName="x2" values="980;-20" dur="0.7s" begin="0.3s" repeatCount="indefinite"/>
      </line>
    </g>

    <!-- the car: drifts forward/back a bit and bobs -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="150 0;210 0;150 0" dur="6s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="0.3s" repeatCount="indefinite"/>
        <!-- headlight beam -->
        <polygon points="190,198 330,180 330,232" fill="url(#beam)"/>
        <!-- shadow -->
        <ellipse cx="100" cy="238" rx="95" ry="6" fill="#000" opacity="0.45"/>
        <!-- body -->
        <path d="M10,215 Q12,198 35,195 L62,193 Q80,172 110,170 L140,170 Q160,172 175,192 L188,196 Q196,200 194,215 Q194,222 186,223 L18,223 Q9,222 10,215 Z" fill="url(#body)"/>
        <!-- windows -->
        <path d="M72,193 Q86,177 108,176 L120,176 L120,193 Z" fill="#8fd3ff" opacity="0.85"/>
        <path d="M126,176 L140,176 Q154,178 165,193 L126,193 Z" fill="#8fd3ff" opacity="0.85"/>
        <!-- racing stripe + details -->
        <rect x="18" y="203" width="172" height="4" fill="#fff" opacity="0.9"/>
        <rect x="183" y="198" width="10" height="6" rx="2" fill="#fff6c2"/>
        <rect x="10" y="200" width="7" height="6" rx="2" fill="#ff2a2a"/>
        <text x="96" y="219" font-family="Verdana, sans-serif" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">CpE</text>
        <!-- wheels -->
        <g transform="translate(52 223)">
          <circle r="15" fill="#111"/><circle r="8" fill="#9aa0b4"/>
          <g stroke="#333" stroke-width="2">
            <line x1="-8" y1="0" x2="8" y2="0"/><line x1="0" y1="-8" x2="0" y2="8"/>
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.4s" repeatCount="indefinite"/>
          </g>
        </g>
        <g transform="translate(152 223)">
          <circle r="15" fill="#111"/><circle r="8" fill="#9aa0b4"/>
          <g stroke="#333" stroke-width="2">
            <line x1="-8" y1="0" x2="8" y2="0"/><line x1="0" y1="-8" x2="0" y2="8"/>
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.4s" repeatCount="indefinite"/>
          </g>
        </g>
        <!-- exhaust puffs -->
        <circle cx="4" cy="218" r="4" fill="#cfcfe0">
          <animate attributeName="cx" values="4;-40" dur="0.8s" repeatCount="indefinite"/>
          <animate attributeName="r" values="3;9" dur="0.8s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.6;0" dur="0.8s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>

    <!-- title -->
    <text x="450" y="62" font-family="'Segoe UI', Verdana, sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">
      HI, I'M <tspan fill="#ffd36b">SEANN</tspan>
    </text>
    <text x="450" y="92" font-family="'Segoe UI', Verdana, sans-serif" font-size="15" fill="#c9b8ff" text-anchor="middle" letter-spacing="4">
      COMPUTER ENGINEER · BUILDER · GAMER
    </text>
  </g>
</svg>
